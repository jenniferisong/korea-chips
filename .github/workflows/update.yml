name: Update chip trade tracker

on:
  schedule:
    - cron: "17 6 * * 1"   # every Monday, 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "site/**"
      - "tests/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: chip-tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pandas pytest

      - name: Test the analysis code
        run: python -m pytest -q tests

      - name: Download new data from UN Comtrade
        run: python fetch.py

      - name: Build the site
        run: python build.py

      - name: Save the updated data back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/comtrade.csv
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "Update trade data ($(date -u +%Y-%m-%d))"
            git pull --rebase
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # GitHub Pages is free on public repos only.
    if: github.event.repository.private == false
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
